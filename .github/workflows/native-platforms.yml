name: Native Rust platform qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.22.3
      - name: Install pinned compilers
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - run: npm run build:rust
      - run: npm run build:rust-sqlite
      - name: Verify native driver, release lease, and platform-specific artifact
        env:
          TRUST_SQLITE_DRIVER: rust
          TRUST_RUST_CORE: required
        run: node --test test/native-storage.test.js test/runtime-distribution.test.js
      - run: npm run verify:native-release
