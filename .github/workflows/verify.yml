name: Verify MVW Trust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvw-trust-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local runtime, release and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.22.3
      - name: Check runtime and exercise launches and SQLite recovery
        run: |
          npm run verify:runtime -- --sqlite
          npm run verify:startup -- --sqlite
          npm run start:release -- --check
      - name: Verify offline source release reproducibility and extracted startup
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          npm run release:local -- "$scratch/first.tgz"
          npm run release:local -- "$scratch/second.tgz"
          cmp "$scratch/first.tgz" "$scratch/second.tgz"
          tar -xzf "$scratch/first.tgz" -C "$scratch"
          cd "$scratch/package"
          npm run release:verify
          npm run verify:startup
      - name: Install locked test-only browser tools
        run: npm --prefix scripts/browser-tools ci --ignore-scripts --no-audit --no-fund
      - name: Run unit, HTTP and real Chromium tests
        run: npm run test:browser
      - name: Install locked OIDC dependencies
        run: npm --prefix oidc ci --ignore-scripts --no-audit --no-fund
      - name: Verify corporate sign-in over loopback HTTP and HTTPS in Chromium
        run: |
          set -euo pipefail
          npm run test:corporate
          fixture_tls="$(mktemp -d)"
          trap 'rm -rf "$fixture_tls"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=local-oidc-fixture' \
            -addext 'subjectAltName=IP:127.0.0.1,IP:127.0.0.2' \
            -keyout "$fixture_tls/key.pem" -out "$fixture_tls/cert.pem"
          NODE_EXTRA_CA_CERTS="$fixture_tls/cert.pem" \
            TRUST_TEST_OIDC_TLS_CERT="$fixture_tls/cert.pem" \
            TRUST_TEST_OIDC_TLS_KEY="$fixture_tls/key.pem" \
            RUN_BROWSER_SMOKE=1 npm run test:corporate
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.13.0
      - name: Verify minimum Node runtime, release startup and receiving reconciliation
        run: |
          node scripts/runtime-check.js --sqlite
          node start-release.js --check
          node --test --test-concurrency=1 test/fixture-migration.test.js test/operational-health.test.js test/release-launcher.test.js
  windows-launch:
    name: Windows PowerShell isolated launch
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.22.3
      - name: Verify Node SQLite and the documented PowerShell launch
        shell: pwsh
        run: |
          node .\scripts\runtime-check.js --sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\start-release.js --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  rust-core:
    name: Rust core compilation and Node/browser parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.22.3
      - name: Install pinned Rust compiler and Wasm target
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - name: Test native Rust and compile dependency-free Wasm
        run: |
          cargo +1.85.1 test --manifest-path rust-core/Cargo.toml --locked --offline
          npm run build:rust
      - name: Require Rust for targeted integration and differential tests
        run: npm run test:rust
      - name: Install locked browser tools
        run: npm --prefix scripts/browser-tools ci --ignore-scripts --no-audit --no-fund
      - name: Run integrated browser suite with compiled Rust available
        run: npm run test:browser
