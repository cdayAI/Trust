name: Verify MVW Trust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvw-trust-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local runtime, release and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.22.3
      - name: Check runtime and exercise launches and SQLite recovery
        run: |
          npm run verify:runtime -- --sqlite
          npm run verify:startup -- --sqlite
      - name: Verify offline source release reproducibility and extracted startup
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          npm run release:local -- "$scratch/first.tgz"
          npm run release:local -- "$scratch/second.tgz"
          cmp "$scratch/first.tgz" "$scratch/second.tgz"
          tar -xzf "$scratch/first.tgz" -C "$scratch"
          cd "$scratch/package"
          npm run release:verify
          npm run verify:startup
      - name: Install locked test-only browser tools
        run: npm --prefix scripts/browser-tools ci --ignore-scripts --no-audit --no-fund
      - name: Run unit, HTTP and real Chromium tests
        run: npm run test:browser
