name: Native Rust HTTP transport
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.22.3
      - name: Install pinned compilers
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - name: Enforce committed transport dependencies
        run: cargo +1.95.0 metadata --manifest-path native-http/Cargo.toml --locked --format-version 1 > /dev/null
      - run: npm run build:rust
      - run: npm run build:rust-sqlite
      - run: npm run build:rust-http
      - name: Verify packaged native listener, storage and core
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          npm run release:native-http -- "$scratch/first.tgz"
          npm run release:native-http -- "$scratch/second.tgz"
          cmp "$scratch/first.tgz" "$scratch/second.tgz"
          tar -xzf "$scratch/first.tgz" -C "$scratch"
          cd "$scratch/package"
          npm run release:verify
          npm run start:release -- --check
          if TRUST_HTTP_TRANSPORT=node node -e "require('./native-http-transport')"; then exit 1; fi
          if TRUST_SQLITE_DRIVER=node node -e "require('./storage-driver')"; then exit 1; fi
          if TRUST_RUST_CORE=off node -e "require('./rust-core')"; then exit 1; fi
          artifact="native-http/runtime/trust-http"
          cp "$artifact" "$scratch/original"
          node -e "const fs=require('node:fs'),p=process.argv[1],b=fs.readFileSync(p);b[b.length-1]^=1;fs.writeFileSync(p,b)" "$artifact"
          if npm run release:verify; then exit 1; fi
          if node -e "require('./native-http-transport')"; then exit 1; fi
          rm "$artifact"
          if npm run release:verify; then exit 1; fi
          if node -e "require('./native-http-transport')"; then exit 1; fi
          cp "$scratch/original" "$artifact"
          npm run release:verify
      - run: npm run test:rust-http
      - name: Install browser tools
        run: npm --prefix scripts/browser-tools ci --ignore-scripts --no-audit --no-fund
      - name: Verify Chromium journeys through native listener
        env:
          TRUST_HTTP_TRANSPORT: rust
          TRUST_RUST_CORE: required
          TRUST_SQLITE_DRIVER: rust
        run: npm run test:browser -- test/browser-isolated-release-nav.test.js test/browser-release-processing-rework.test.js test/browser-release-report-schedule-race.test.js
