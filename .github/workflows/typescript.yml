name: Strict TypeScript and runtime parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.22.3
      - run: npm --prefix scripts/type-tools ci --ignore-scripts --no-audit --no-fund
      - name: Compile strict operator views and record output
        run: node scripts/typescript-build.js report
      - run: npm run verify:typescript
      - run: npm run verify:startup -- --sqlite
      - run: node --test test/api.test.js test/access-policy.test.js test/attachment-binary-batch.test.js test/assessment-config.test.js test/workspace-home.test.js test/employee-attestations.test.js test/trust-center.test.js test/runtime-distribution.test.js test/local-performance.test.js test/reporting.test.js test/native-storage.test.js test/workflow-engine.test.js test/workflow-http.test.js test/workflow-studio.test.js test/assessment-workflow-http.test.js test/assessment-incident.test.js test/work-queue-pagination.test.js test/my-work.test.js test/remediation-my-work.test.js test/reporting-runs.test.js test/report-schedules.test.js test/discovery-import.test.js
      - run: npm --prefix scripts/browser-tools ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:browser -- test/browser-portal-controls.test.js test/browser-acceptance.test.js test/employee-attestations.test.js test/trust-center.test.js test/browser-workflow-actions.test.js test/browser-concurrent-review.test.js test/browser-release-report-schedule-race.test.js test/browser-admin-controls.test.js test/browser-isolated-release-nav.test.js test/browser-edge-controls.test.js test/browser.test.js test/workspace-home.test.js test/work-queue-pagination.test.js test/identity-admin.test.js test/data-dictionary.test.js
